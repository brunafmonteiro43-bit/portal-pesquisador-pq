name: CI - Lint e Tipagem

# Define quando esse robô vai rodar
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verificacao:
    name: Validação de Código
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixando o código
        uses: actions/checkout@v4

      - name: ⚙️ Configurando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usa a versão 20 do Node (padrão atual)
          cache: 'npm'       # Troque para 'yarn' ou 'pnpm' se você não usar npm

      - name: 📦 Instalando dependências
        run: npm ci # Instala os pacotes exatamente como estão no package-lock.json

      - name: 🧹 Rodando o Linter (Next.js ESLint)
        run: npm run lint

      - name: 🔎 Verificando Tipagem (TypeScript)
        run: npx tsc --noEmit
